frr defaults traditional
hostname pe1
!
vrf red
exit-vrf
!
vrf blue
exit-vrf
!
ipv6 route fc00:0:2::/48 2001:db8:1::2
!
router bgp 65000
 bgp router-id 1.1.1.1
 no bgp default ipv4-unicast
 neighbor fc00:0:2::1 remote-as 65000
 neighbor fc00:0:2::1 update-source lo
 neighbor fc00:0:2::1 capability extended-nexthop
 !
 segment-routing srv6
  locator MAIN
 exit
 !
 address-family ipv4 vpn
  neighbor fc00:0:2::1 activate
 exit-address-family
exit
!
router bgp 65000 vrf red
 sid vpn per-vrf export auto
 !
 address-family ipv4 unicast
  redistribute connected
  rd vpn export 65000:10
  rt vpn both 65000:10
  export vpn
  import vpn
 exit-address-family
exit
!
router bgp 65000 vrf blue
 sid vpn per-vrf export auto
 !
 address-family ipv4 unicast
  redistribute connected
  rd vpn export 65000:20
  rt vpn both 65000:20
  export vpn
  import vpn
 exit-address-family
exit
!
segment-routing
 srv6
  encapsulation
   source-address fc00:0:1::1
  locators
   locator MAIN
    prefix fc00:0:1::/48 block-len 32 node-len 16
    behavior usid
   exit
  exit
 exit
exit
