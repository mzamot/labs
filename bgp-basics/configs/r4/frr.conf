frr defaults traditional
hostname r4
!
interface lo
 ip address 10.4.0.1/24
 ipv6 address 2001:db8:4::1/64
exit
!
interface eth1
 ip address 10.0.34.2/24
 ipv6 address 2001:db8:34::2/64
exit
!
router bgp 65003
 bgp router-id 4.4.4.4
 no bgp default ipv4-unicast
 no bgp ebgp-requires-policy
 neighbor 10.0.34.1 remote-as 65002
 neighbor 10.0.34.1 timers connect 5
 neighbor 2001:db8:34::1 remote-as 65002
 neighbor 2001:db8:34::1 timers connect 5
 !
 address-family ipv4 unicast
  network 10.4.0.0/24
  neighbor 10.0.34.1 activate
 exit-address-family
 !
 address-family ipv6 unicast
  network 2001:db8:4::/64
  neighbor 2001:db8:34::1 activate
 exit-address-family
exit
