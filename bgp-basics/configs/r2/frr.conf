frr defaults traditional
hostname r2
!
interface lo
 ip address 10.2.0.1/24
 ipv6 address 2001:db8:2::1/64
exit
!
interface eth1
 ip address 10.0.12.2/24
 ipv6 address 2001:db8:12::2/64
exit
!
interface eth2
 ip address 10.0.23.1/24
 ipv6 address 2001:db8:23::1/64
exit
!
router bgp 65002
 bgp router-id 2.2.2.2
 no bgp default ipv4-unicast
 no bgp ebgp-requires-policy
 neighbor 10.0.12.1 remote-as 65001
 neighbor 10.0.12.1 timers connect 5
 neighbor 10.0.23.2 remote-as 65002
 neighbor 10.0.23.2 timers connect 5
 neighbor 2001:db8:12::1 remote-as 65001
 neighbor 2001:db8:12::1 timers connect 5
 neighbor 2001:db8:23::2 remote-as 65002
 neighbor 2001:db8:23::2 timers connect 5
 !
 address-family ipv4 unicast
  network 10.2.0.0/24
  neighbor 10.0.12.1 activate
  neighbor 10.0.23.2 activate
  neighbor 10.0.23.2 next-hop-self
 exit-address-family
 !
 address-family ipv6 unicast
  network 2001:db8:2::/64
  neighbor 2001:db8:12::1 activate
  neighbor 2001:db8:23::2 activate
  neighbor 2001:db8:23::2 next-hop-self
 exit-address-family
exit
