frr defaults traditional
hostname r1
!
interface lo
 ip address 10.255.0.1/32
 ipv6 address 2001:db8:100::1/128
 ip router isis LAB
 ipv6 router isis LAB
 isis passive
exit
!
interface eth1
 ip address 10.0.12.1/24
 ipv6 address 2001:db8:12::1/64
 ip router isis LAB
 ipv6 router isis LAB
 isis network point-to-point
exit
!
interface eth2
 ip address 10.0.41.2/24
 ipv6 address 2001:db8:41::2/64
 ip router isis LAB
 ipv6 router isis LAB
 isis network point-to-point
 isis metric 50
exit
!
router isis LAB
 is-type level-1
 net 49.0001.0000.0000.0001.00
 log-adjacency-changes
 lsp-gen-interval 1
exit
