frr defaults traditional
hostname spine
!
interface lo
 ipv6 address fc00:0:100::1/128
 ipv6 router isis FABRIC
 isis passive
exit
!
interface eth1
 ipv6 router isis FABRIC
 isis network point-to-point
exit
!
interface eth2
 ipv6 router isis FABRIC
 isis network point-to-point
exit
!
interface eth3
 ipv6 router isis FABRIC
 isis network point-to-point
exit
!
! A spare server-facing port, configured like the others before anything is attached
interface eth4
 ipv6 router isis FABRIC
 isis network point-to-point
exit
!
router isis FABRIC
 is-type level-1
 net 49.0001.0000.0000.0100.00
 lsp-gen-interval 1
exit
!
router bgp 65000
 bgp router-id 100.100.100.100
 no bgp default ipv4-unicast
 neighbor NODES peer-group
 neighbor NODES remote-as 65000
 neighbor NODES update-source lo
 neighbor NODES capability extended-nexthop
 ! Accept a session from any PE loopback in the locator space
 bgp listen range fc00:0::/32 peer-group NODES
 !
 address-family ipv4 vpn
  neighbor NODES activate
  neighbor NODES route-reflector-client
 exit-address-family
exit
