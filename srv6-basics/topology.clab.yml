name: srv6

topology:
  kinds:
    linux:
      image: localhost/srv6-node:latest

  nodes:
    h1:
      kind: linux
      exec:
        - ip addr add 10.1.1.2/24 dev eth1
        - ip route add default via 10.1.1.1
    r1:
      kind: linux
      binds:
        - configs/r1.sh:/setup.sh
      exec:
        - sh /setup.sh
    r2:
      kind: linux
      binds:
        - configs/r2.sh:/setup.sh
      exec:
        - sh /setup.sh
    r3:
      kind: linux
      binds:
        - configs/r3.sh:/setup.sh
      exec:
        - sh /setup.sh
    r4:
      kind: linux
      binds:
        - configs/r4.sh:/setup.sh
      exec:
        - sh /setup.sh
    h2:
      kind: linux
      exec:
        - ip addr add 10.2.2.2/24 dev eth1
        - ip route add default via 10.2.2.1

  links:
    - endpoints: ["h1:eth1", "r1:eth1"]
    - endpoints: ["r1:eth2", "r2:eth1"]
    - endpoints: ["r2:eth2", "r3:eth1"]
    - endpoints: ["r3:eth2", "r4:eth1"]
    - endpoints: ["r4:eth2", "h2:eth1"]
